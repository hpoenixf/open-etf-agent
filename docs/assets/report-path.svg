<svg xmlns="http://www.w3.org/2000/svg" width="660" height="280" viewBox="0 0 660 280" role="img" aria-labelledby="title desc"><title id="title">From input to a readable report</title><desc id="desc">01 INPUT → Question + synthetic sources → 02 RESEARCH → Runtime ⇄ tools / originals → 03 DELIVERY → Report + citations + byte readback</desc><rect width="660" height="280" rx="18" fill="#10243e"/><g font-family="system-ui,sans-serif"><text x="24" y="42" fill="#79d7c1" font-size="19" font-weight="700">01 INPUT</text><text x="175" y="42" fill="white" font-size="20">Question + synthetic sources</text><path d="M42 54v28m-5-5 5 5 5-5" fill="none" stroke="#819ab5" stroke-width="2"/><text x="24" y="114" fill="#79d7c1" font-size="19" font-weight="700">02 RESEARCH</text><text x="175" y="114" fill="white" font-size="20">Runtime ⇄ tools / originals</text><path d="M42 126v28m-5-5 5 5 5-5" fill="none" stroke="#819ab5" stroke-width="2"/><text x="24" y="186" fill="#79d7c1" font-size="19" font-weight="700">03 DELIVERY</text><text x="175" y="186" fill="white" font-size="20">Report + citations + byte readback</text><text x="24" y="253" fill="#c5d9ed" font-size="16">The model proposes; code checks authority. Default demo: no model key.</text></g></svg>
