<svg xmlns="http://www.w3.org/2000/svg" width="660" height="280" viewBox="0 0 660 280" role="img" aria-labelledby="title desc"><title id="title">从输入到可回读报告</title><desc id="desc">01 输入 → 问题 + 合成资料 → 02 研究 → Runtime ⇄ 工具 / 原始来源 → 03 交付 → 报告 + 引用 + 原字节回读</desc><rect width="660" height="280" rx="18" fill="#10243e"/><g font-family="system-ui,sans-serif"><text x="24" y="42" fill="#79d7c1" font-size="19" font-weight="700">01 输入</text><text x="175" y="42" fill="white" font-size="20">问题 + 合成资料</text><path d="M42 54v28m-5-5 5 5 5-5" fill="none" stroke="#819ab5" stroke-width="2"/><text x="24" y="114" fill="#79d7c1" font-size="19" font-weight="700">02 研究</text><text x="175" y="114" fill="white" font-size="20">Runtime ⇄ 工具 / 原始来源</text><path d="M42 126v28m-5-5 5 5 5-5" fill="none" stroke="#819ab5" stroke-width="2"/><text x="24" y="186" fill="#79d7c1" font-size="19" font-weight="700">03 交付</text><text x="175" y="186" fill="white" font-size="20">报告 + 引用 + 原字节回读</text><text x="24" y="253" fill="#c5d9ed" font-size="16">模型提议，代码核权执行；默认示例无需模型密钥。</text></g></svg>
