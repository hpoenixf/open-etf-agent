<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1040" viewBox="0 0 660 1040" role="img" aria-labelledby="title desc"><title id="title">Open ETF Agent 六层模块现状</title><desc id="desc">L1 任务输入与触发: CLI · Research Project · Schedule. 本地单用户；非周期调度或常驻后台服务; L2 身份、会话与上下文: Session · Context · Memory · Skill · Conversation. 记忆不是原始证据；不扩展授权; L3 Agent 决策与运行: Runtime · Gateway · Worker · Child · Admission. 运行完成 ≠ 答案准确；未知请求保留; L4 工具与领域能力: Tools · MCP · Plugin · Result · Knowledge · Web / PDF. 静态网页 / PDF文本；非实时金融数据; L5 结果发布与交付: Report · Artifact · Publication · Review. 保存、发布、质量结论分别核验; L6 用户界面: CLI · Loopback Reader. 不是完整 Web 工作台；无浏览器验收声明</desc><rect width="660" height="1040" rx="20" fill="#f5f8fc"/><path d="M20 0h620q20 0 20 20v95H0V20Q0 0 20 0" fill="#10243e"/><g font-family="system-ui, sans-serif"><text x="24" y="39" fill="white" font-size="24" font-weight="700">Open ETF Agent · v0.30.0</text><text x="24" y="73" fill="#c5d9ed" font-size="18">六层职责地图 · 公开实现，不等于全面验收</text><rect x="16" y="128" width="628" height="132" rx="12" fill="white" stroke="#d7e1ed"/><rect x="16" y="128" width="7" height="132" rx="3" fill="#2868a9"/><text x="34" y="157" fill="#2868a9" font-size="21" font-weight="700">L1 · 任务输入与触发</text><text x="34" y="184" fill="#142d48" font-size="18">CLI · Research Project · Schedule</text><text x="34" y="208" fill="#274b64" font-size="16">项目提交、一次计划执行与显式继续</text><text x="34" y="229" fill="#52657b" font-size="16">本地单用户；非周期调度或常驻后台服务</text><rect x="16" y="270" width="628" height="132" rx="12" fill="white" stroke="#d7e1ed"/><rect x="16" y="270" width="7" height="132" rx="3" fill="#257d78"/><text x="34" y="299" fill="#257d78" font-size="21" font-weight="700">L2 · 身份、会话与上下文</text><text x="34" y="326" fill="#142d48" font-size="18">Session · Context · Memory · Skill · Conversation</text><text x="34" y="350" fill="#274b64" font-size="16">原任务身份、资料窗口与显式记忆</text><text x="34" y="371" fill="#52657b" font-size="16">记忆不是原始证据；不扩展授权</text><rect x="16" y="412" width="628" height="132" rx="12" fill="white" stroke="#d7e1ed"/><rect x="16" y="412" width="7" height="132" rx="3" fill="#6b58a2"/><text x="34" y="441" fill="#6b58a2" font-size="21" font-weight="700">L3 · Agent 决策与运行</text><text x="34" y="468" fill="#142d48" font-size="18">Runtime · Gateway · Worker · Child · Admission</text><text x="34" y="492" fill="#274b64" font-size="16">接续、共享预算、子任务独立取消</text><text x="34" y="513" fill="#52657b" font-size="16">运行完成 ≠ 答案准确；未知请求保留</text><rect x="16" y="554" width="628" height="132" rx="12" fill="white" stroke="#d7e1ed"/><rect x="16" y="554" width="7" height="132" rx="3" fill="#246f88"/><text x="34" y="583" fill="#246f88" font-size="21" font-weight="700">L4 · 工具与领域能力</text><text x="34" y="610" fill="#142d48" font-size="18">Tools · MCP · Plugin · Result · Knowledge · Web / PDF</text><text x="34" y="634" fill="#274b64" font-size="16">原文读取、来源回读、受限计算</text><text x="34" y="655" fill="#52657b" font-size="16">静态网页 / PDF文本；非实时金融数据</text><rect x="16" y="696" width="628" height="132" rx="12" fill="white" stroke="#d7e1ed"/><rect x="16" y="696" width="7" height="132" rx="3" fill="#a76625"/><text x="34" y="725" fill="#a76625" font-size="21" font-weight="700">L5 · 结果发布与交付</text><text x="34" y="752" fill="#142d48" font-size="18">Report · Artifact · Publication · Review</text><text x="34" y="776" fill="#274b64" font-size="16">不可变版本、正文接纳与复核建议</text><text x="34" y="797" fill="#52657b" font-size="16">保存、发布、质量结论分别核验</text><rect x="16" y="838" width="628" height="132" rx="12" fill="white" stroke="#d7e1ed"/><rect x="16" y="838" width="7" height="132" rx="3" fill="#506779"/><text x="34" y="867" fill="#506779" font-size="21" font-weight="700">L6 · 用户界面</text><text x="34" y="894" fill="#142d48" font-size="18">CLI · Loopback Reader</text><text x="34" y="918" fill="#274b64" font-size="16">命令行操作、本机报告与附件回读</text><text x="34" y="939" fill="#52657b" font-size="16">不是完整 Web 工作台；无浏览器验收声明</text><text x="24" y="1014" fill="#52657b" font-size="16">职责可跨层；不是每次任务必经的六个服务。</text></g></svg>
