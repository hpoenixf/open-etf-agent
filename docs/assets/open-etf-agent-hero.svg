<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Open ETF Agent — build small, keep evidence</title>
  <desc id="desc">A research Agent evolving through five public development stages: first report, Skill and MCP, bounded cooperation, exact source reread, and derived notes with explicit Memory. A question passes through a bounded runtime to a saved, source-linked report.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091726"/>
      <stop offset="1" stop-color="#112b38"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="60" y1="323" x2="1138" y2="323">
      <stop offset="0" stop-color="#87edca"/>
      <stop offset="1" stop-color="#68bdf2"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8bb5c6" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="430" rx="20" fill="url(#surface)"/>
  <rect width="1200" height="430" rx="20" fill="url(#grid)"/>
  <path d="M1200 45C960 45 1060 280 795 280" fill="none" stroke="#87edca" stroke-opacity=".07" stroke-width="80"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <rect x="48" y="39" width="270" height="28" rx="14" fill="#173b40"/>
    <circle cx="64" cy="53" r="4" fill="#87edca"/>
    <text x="77" y="57.5" fill="#b6f5e2" font-size="11.5" letter-spacing="1.1">PUBLIC DEVELOPMENT SNAPSHOTS</text>
    <text x="48" y="135" fill="#f4fafb" font-size="55" font-weight="700" letter-spacing="-2">Open ETF Agent</text>
    <text x="50" y="177" fill="#a4bec9" font-size="21">Build small. Keep evidence.</text>
    <text x="50" y="211" fill="#8ea9b6" font-size="15">A research Agent, evolving one runnable stage at a time.</text>
    <g transform="translate(708 64)">
      <rect width="444" height="183" rx="14" fill="#0a1c2b" stroke="#355362"/>
      <circle cx="20" cy="20" r="3" fill="#7797a6"/>
      <circle cx="32" cy="20" r="3" fill="#527582"/>
      <circle cx="44" cy="20" r="3" fill="#355866"/>
      <text x="76" y="24" fill="#86a7b8" font-size="11" letter-spacing="1.3">QUESTION → EXECUTION → EVIDENCE</text>
      <path d="M27 62H417" stroke="#284452"/>
      <rect x="25" y="84" width="103" height="45" rx="7" fill="#153644" stroke="#3f6675"/>
      <rect x="169" y="84" width="106" height="45" rx="7" fill="#163f40" stroke="#5a9c91"/>
      <rect x="316" y="84" width="103" height="45" rx="7" fill="#153644" stroke="#3f6675"/>
      <text x="76.5" y="112" text-anchor="middle" fill="#d4e6ee" font-size="13">Read sources</text>
      <text x="222" y="112" text-anchor="middle" fill="#b6f5e2" font-size="13">Bounded loop</text>
      <text x="367.5" y="112" text-anchor="middle" fill="#d4e6ee" font-size="13">Save report</text>
      <path d="M133 106H161M154 101L161 106L154 111M280 106H308M301 101L308 106L301 111" fill="none" stroke="#87edca" stroke-width="1.5"/>
      <text x="222" y="157" text-anchor="middle" fill="#8ea9b6" font-size="11.5">Original bytes · Exact references · Explicit limits</text>
    </g>
    <path d="M50 290H1150" stroke="#2c4655"/>
    <path d="M60 323H1138" stroke="url(#accent)" stroke-opacity=".65" stroke-width="2"/>
    <g fill="#0e2533" stroke="#87edca" stroke-width="2">
      <circle cx="60" cy="323" r="6"/>
      <circle cx="281" cy="323" r="6"/>
      <circle cx="502" cy="323" r="6"/>
      <circle cx="723" cy="323" r="6"/>
      <circle cx="944" cy="323" r="6" fill="#87edca"/>
    </g>
    <g fill="#a9dcca" font-size="12" font-family="DejaVu Sans Mono, monospace">
      <text x="50" y="352">v0.1</text><text x="271" y="352">v0.2</text><text x="492" y="352">v0.3</text><text x="713" y="352">v0.4</text><text x="934" y="352">v0.5</text>
    </g>
    <g fill="#d8e7ed" font-size="15">
      <text x="50" y="379">First report</text><text x="271" y="379">Skill + MCP</text><text x="492" y="379">Bounded work</text><text x="713" y="379">Exact reread</text><text x="934" y="379">Notes + Memory</text>
    </g>
    <text x="1150" y="411" text-anchor="end" fill="#7e9ba8" font-size="10.5" letter-spacing=".8">LOCAL · SYNTHETIC DATA · OFFLINE FIRST</text>
  </g>
</svg>
