name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check English and Chinese coverage views (no Runtime execution)
        run: node --test --test-concurrency=1 scripts/article-localization.test.mjs
      - name: Check existing fixed-source coverage receipts (no smoke)
        run: node scripts/check-article-coverage.mjs --check
      - name: Check fixed article backlinks (read-only; no Runtime execution)
        run: |
          node --test --test-concurrency=1 scripts/check-article-backlinks.test.mjs scripts/article-receipt-binding.test.mjs
          node scripts/check-article-backlinks.mjs --code
          node scripts/check-article-backlinks.mjs --localization
      - name: Run the complete Runtime suite
        run: npm test
