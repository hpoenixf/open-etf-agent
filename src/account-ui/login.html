<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open ETF Agent · 工作台登录</title><script type="module" src="/account/login.mjs"></script></head>
<body><main><h1>Open ETF Agent</h1><p>使用已经开通的账号登录。此工作台不开放自行注册。</p>
<form id="login"><p><label>账号邮箱 <input id="email" type="email" required autocomplete="username"></label></p>
<p><label>密码 <input id="password" type="password" required autocomplete="current-password"></label></p>
<button type="submit">登录</button></form>
<section id="session" hidden><p><a href="/">进入工作台</a></p><button type="button" id="logout">退出登录</button></section>
<p id="status" role="status"></p></main></body></html>
